<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="DejaVu Sans, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/></marker></defs>
<rect width="1400" height="860" fill="#ffffff"/>
<rect x="60" y="380" width="140" height="76" rx="10" fill="#ffffff" stroke="#243447" stroke-width="2.5"/>
<text x="130.0" y="412.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">IDLE</text>
<text x="130.0" y="435.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 0</text>
<rect x="270" y="380" width="140" height="76" rx="10" fill="#ffffff" stroke="#243447" stroke-width="2.5"/>
<text x="340.0" y="412.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">READY</text>
<text x="340.0" y="435.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 1</text>
<rect x="480" y="380" width="150" height="76" rx="10" fill="#e8f1fb" stroke="#243447" stroke-width="2.5"/>
<text x="555.0" y="412.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">RUNNING</text>
<text x="555.0" y="435.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 2</text>
<rect x="1180" y="380" width="150" height="76" rx="10" fill="#ffffff" stroke="#243447" stroke-width="2.5"/>
<text x="1255.0" y="412.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">STOPPING</text>
<text x="1255.0" y="435.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 8</text>
<rect x="790" y="210" width="160" height="76" rx="10" fill="#ffffff" stroke="#243447" stroke-width="2.5"/>
<text x="870.0" y="242.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">P1_DIVERT</text>
<text x="870.0" y="265.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 4</text>
<rect x="1030" y="210" width="170" height="76" rx="10" fill="#ffffff" stroke="#243447" stroke-width="2.5"/>
<text x="1115.0" y="242.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">P1_RETURN</text>
<text x="1115.0" y="265.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 5</text>
<rect x="790" y="520" width="160" height="76" rx="10" fill="#ffffff" stroke="#243447" stroke-width="2.5"/>
<text x="870.0" y="552.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">P2_DIVERT</text>
<text x="870.0" y="575.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 6</text>
<rect x="1030" y="520" width="170" height="76" rx="10" fill="#ffffff" stroke="#243447" stroke-width="2.5"/>
<text x="1115.0" y="552.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">P2_RETURN</text>
<text x="1115.0" y="575.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 7</text>
<rect x="470" y="700" width="150" height="76" rx="10" fill="#fdf1e7" stroke="#243447" stroke-width="2.5"/>
<text x="545.0" y="732.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">FAULT</text>
<text x="545.0" y="755.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 9</text>
<rect x="690" y="700" width="150" height="76" rx="10" fill="#fbe9e7" stroke="#243447" stroke-width="2.5"/>
<text x="765.0" y="732.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#12212f">ESTOP</text>
<text x="765.0" y="755.0" font-size="13" text-anchor="middle" fill="#5c6b7a">state 10</text>
<path d="M200,418 L270,418" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)"/>
<text x="235" y="356" font-size="14" text-anchor="middle" fill="#243447">START</text>
<text x="235" y="372" font-size="14" text-anchor="middle" fill="#243447">(all healthy)</text>
<path d="M410,418 L480,418" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)"/>
<text x="445" y="402" font-size="14" text-anchor="middle" fill="#243447">seal</text>
<path d="M630,398 L710,398 L710,248 L790,248" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)"/>
<text x="720" y="320" font-size="14" text-anchor="start" fill="#243447">box at S1</text>
<text x="720" y="336" font-size="14" text-anchor="start" fill="#243447">(p1_queued>0)</text>
<path d="M950,248 L1030,248" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)"/>
<text x="990" y="232" font-size="14" text-anchor="middle" fill="#243447">P1_EXT</text>
<path d="M1115,210 L1115,120 L565,120 L565,380" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)"/>
<text x="840" y="110" font-size="14" text-anchor="middle" fill="#243447">P1_HOME</text>
<path d="M630,438 L710,438 L710,558 L790,558" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)"/>
<text x="725" y="462" font-size="14" text-anchor="start" fill="#243447">box at S2</text>
<text x="725" y="478" font-size="14" text-anchor="start" fill="#243447">(FIFO head)</text>
<path d="M950,558 L1030,558" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)"/>
<text x="990" y="542" font-size="14" text-anchor="middle" fill="#243447">P2_EXT</text>
<path d="M1115,520 L1115,490 L612,490 L612,456" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)"/>
<text x="860" y="483" font-size="14" text-anchor="middle" fill="#243447">P2_HOME</text>
<path d="M630,418 L1180,418" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)"/>
<text x="900" y="402" font-size="14" text-anchor="middle" fill="#243447">STOP (any state)</text>
<path d="M1255,456 L1255,840 L170,840 L170,456" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="7 5"/>
<text x="700" y="832" font-size="14" text-anchor="middle" fill="#243447">outputs off, then IDLE</text>
<path d="M585,456 L585,660 L545,660 L545,700" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="7 5"/>
<path d="M585,660 L765,660 L765,700" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="7 5"/>
<text x="600" y="646" font-size="13" fill="#243447">any state: E-Stop, overload, pusher timeout, record without a box</text>
<path d="M470,738 L430,738 L430,600 L100,600 L100,456" fill="none" stroke="#243447" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="7 5"/>
<text x="200" y="806" font-size="14" text-anchor="start" fill="#243447">RESET (cause cleared) → IDLE, then a separate START</text>
<rect x="60" y="170" width="380" height="150" rx="8" fill="#f5f7fa" stroke="#c3ccd6" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="76" y="196" font-size="14" font-weight="bold" fill="#243447">Classification — every scan, outside the CASE</text>
<text x="76" y="220" font-size="13" fill="#3b4a59">Two samples of S1_SIZE 200 ms apart. Both tall → LARGE</text>
<text x="76" y="238" font-size="13" fill="#3b4a59">(p1_queued), both short → SMALL (FIFO), differ or short</text>
<text x="76" y="256" font-size="13" fill="#3b4a59">pulse → REJECT (FIFO). State 3 is reserved for this and</text>
<text x="76" y="274" font-size="13" fill="#3b4a59">is never used: no actuator waits on the classifier.</text>
<text x="60" y="56" font-size="30" font-weight="bold" fill="#12212f">Conveyor sorter — state machine (state word %QW0)</text>
<text x="60" y="82" font-size="15" fill="#5c6b7a">One CASE branch per state. Valves may only be energized in P1_DIVERT / P2_DIVERT. Counters survive every trap.</text>
</svg>